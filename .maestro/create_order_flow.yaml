appId: com.zarpa.mobile
---
# Scenario 1: Launch and Authenticate as Merchant
- launchApp:
    clearState: true
- tapOn: "Acessar Minha Conta"
- tapOn:
    id: "login-quick-client"
- assertVisible: "Lojista / Comércio"

# Scenario 2: Navigate to New Order Tab and Select Store Pickup Point
- tapOn: "Novo Pedido"
- assertVisible: "Novo Pedido de Entrega"
- assertVisible: "Ponto de Coleta (Origem)"
- tapOn:
    id: "origin-store-address-button"
- assertVisible: "Coleta Definida:"

# Scenario 3: Search Destination and Fill Package Details
- tapOn:
    id: "destination-search-input"
- inputText: "UTFPR"
- waitForAnimationToEnd: 1000
- tapOn:
    id: "suggestion-item-0"
- assertVisible: "Destino Definido:"

- tapOn:
    id: "package-description-input"
- inputText: "Peças Eletrônicas e Cabos"

- tapOn:
    id: "package-weight-input"
- eraseText
- inputText: "2.5"

# Scenario 4: Select Economic Shipping Modality
- tapOn:
    id: "modality-economic-button"
- assertVisible: "-20% Rateio"

# Scenario 5: Submit Order and Validate in Orders List
- scroll
- tapOn:
    id: "submit-order-button"
- assertVisible: "Sucesso!"
- tapOn: "Ver Meus Pedidos"
- assertVisible: "Peças Eletrônicas e Cabos"
- assertVisible: "Pendente"
- takeScreenshot: order_created_success
