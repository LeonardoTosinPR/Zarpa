services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: zarpa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zarpa}
      POSTGRES_USER: ${DB_USERNAME:-zarpa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zarpa_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zarpa} -d ${DB_DATABASE:-zarpa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zarpa_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-zarpa}
      DB_USERNAME: ${DB_USERNAME:-zarpa}
      DB_PASSWORD: ${DB_PASSWORD:-zarpa_secret}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "if [ ! -f vendor/autoload.php ]; then
               echo 'Instalando dependências do Composer...';
               composer install --no-interaction;
             fi &&
             if ! grep -qE '^APP_KEY=base64:' .env 2>/dev/null; then
               php artisan key:generate --force;
             fi &&
             php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  postgres_data:
    driver: local

